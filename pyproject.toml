[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-manager"
dynamic = ["version"]
description = "Tag and rename a local music library from Discogs"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Jami L. Boucher"}]
dependencies = [
    "requests",
    "mutagen",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
discogs-tag = "discogs_tag:main"
album-m3u = "album_m3u:main"

[project.urls]
Homepage = "https://github.com/JimmyWonko/music-manager"

[tool.setuptools]
py-modules = ["discogs_tag", "album_m3u", "mm_common"]

[tool.setuptools.dynamic]
version = {attr = "mm_common.__version__"}
