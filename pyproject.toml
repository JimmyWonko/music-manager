[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-manager"
dynamic = ["version"]
description = "Tag and rename a local music library from Discogs"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "James Boucher"}]
dependencies = [
    "requests",
    "mutagen",
]

[project.optional-dependencies]
dev = ["pytest"]
ui = ["PySide6"]
ui-test = ["PySide6", "pytest", "pytest-qt"]

[project.scripts]
discogs-tag = "music_manager.cli.discogs_tag:main"
album-m3u = "music_manager.cli.album_m3u:main"

[project.gui-scripts]
mm-ui = "mm_ui.app:main"

[project.urls]
Homepage = "https://github.com/JimmyWonko/music-manager"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "music_manager.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
